services:
  # ==================== POSTGRES ====================
  db:
    image: postgres:16-alpine
    container_name: tests_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Наружу не обязательно — только если хочешь цепляться psql'ом с хоста
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== BACKEND (FastAPI) ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tests_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Перебиваем DATABASE_URL на внутрисетевой (если в .env был localhost)
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    # Наружу порт не публикуем — доступ только через nginx.
    # Для отладки можно раскомментировать:
    # ports:
    #   - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== FRONTEND + NGINX ====================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tests_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata: